version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    groups:
      frontend-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
    groups:
      functions-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'pip'
    directory: '/backend'
    schedule:
      interval: 'weekly'
    groups:
      backend-minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker'
    directory: '/backend'
    schedule:
      interval: 'weekly'
